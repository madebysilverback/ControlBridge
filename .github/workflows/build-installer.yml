name: Build Windows installer

on:
  workflow_dispatch:        # "Run workflow" button on GitHub
  push:
    tags: ["v*"]            # e.g. v0.1.0 also publishes a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install -r requirements.txt pyinstaller

      - name: Build the programs
        run: |
          pyinstaller --onefile --windowed --icon icon.ico --collect-data customtkinter --name ControlBridge controlbridge.py
          pyinstaller --onefile --console --icon icon.ico --name "ControlBridge Prompts" prompts_patcher.py
          pyinstaller --onefile --console --icon icon.ico --name "ControlBridge Profile Maker" profile_maker.py

      - name: Download fonts (Open Sans, Exo 2)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force fonts | Out-Null
          $os = "https://github.com/googlefonts/opensans/raw/main/fonts/ttf"
          foreach ($f in "OpenSans-Regular","OpenSans-SemiBold","OpenSans-Bold") {
            Invoke-WebRequest "$os/$f.ttf" -OutFile "fonts/$f.ttf"
          }
          Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/exo2/Exo2%5Bwght%5D.ttf" -OutFile "fonts/Exo2.ttf"
