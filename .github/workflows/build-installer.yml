name: Build Windows installer

on:
  workflow_dispatch:        # "Run workflow" button on GitHub
  push:
    tags: ["v*"]            # e.g. v0.1.0 also publishes a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install -r requirements.txt pyinstaller

      - name: Build the programs
        run: |
          pyinstaller --onefile --windowed --icon icon.ico --collect-data customtkinter --name ControlBridge controlbridge.py
          pyinstaller --onefile --console --icon icon.ico --name "ControlBridge Prompts" prompts_patcher.py
          pyinstaller --onefile --console --icon icon.ico --name "ControlBridge Profile Maker" profile_maker.py

      - name: Download fonts (Open Sans, Exo 2)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force fonts | Out-Null
          $os = "https://github.com/googlefonts/opensans/raw/main/fonts/ttf"
          foreach ($f in "OpenSans-Regular","OpenSans-SemiBold","OpenSans-Bold") {
            Invoke-WebRequest "$os/$f.ttf" -OutFile "fonts/$f.ttf"
          }
          Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/exo2/Exo2%5Bwght%5D.ttf" -OutFile "fonts/Exo2.ttf"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = (Select-String -Path controlbridge.py -Pattern 'APP_VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value + ".0"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $ver = "${{ github.ref_name }}".TrimStart("v") }
          & $iscc "/DAppVersion=$ver" installer\ControlBridge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: ControlBridge-Setup
          path: dist-installer/ControlBridge-Setup.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/ControlBridge-Setup.exe
